# Base configuration. Put secrets in config.local.yaml (ignored by git).
source: "strava"  # "strava" or "garmin"

strava:
  client_id: ""
  client_secret: ""
  refresh_token: ""
  profile_url: "" # optional dashboard header profile link
  include_activity_urls: false # when true, tooltip details can show links to individual Strava activities

garmin:
  token_store_b64: ""
  email: ""
  password: ""
  profile_url: "" # optional dashboard header profile link
  include_activity_urls: false # when true, tooltip details can show links to individual Garmin activities
  strict_token_only: false # when true, only token_store_b64 is used (no email/password fallback)

sync:
  # Optional history limits:
  start_date: "2018-01-01" # YYYY-MM-DD lower bound (2017 data excluded)
  # lookback_years: 5        # ignored when start_date is set
  recent_days: 7
  resume_backfill: true
  per_page: 200
  prune_deleted: false

rate_limits:
  overall_15_min: 200
  overall_daily: 2000
  read_15_min: 100
  read_daily: 1000
  safety_buffer: 2
  min_interval_seconds: 10

activities:
  types:
    - AlpineSki
    - BackcountrySki
    - Badminton
    - Canoeing
    - Crossfit
    - EBikeRide
    - Elliptical
    - EMountainBikeRide
    - Golf
    - GravelRide
    - Handcycle
    - HighIntensityIntervalTraining
    - Hike
    - IceSkate
    - InlineSkate
    - Kayaking
    - Kitesurf
    - MountainBikeRide
    - NordicSki
    - Pickleball
    - Pilates
    - Racquetball
    - Ride
    - RockClimbing
    - RollerSki
    - Rowing
    - Run
    - Sail
    - Skateboard
    - Snowboard
    - Snowshoe
    - Soccer
    - Squash
    - StairStepper
    - StandUpPaddling
    - Surfing
    - Swim
    - TableTennis
    - Tennis
    - TrailRun
    - Velomobile
    - VirtualRide
    - VirtualRow
    - VirtualRun
    - Walk
    - WeightTraining
    - Wheelchair
    - Windsurf
    - Workout
    - Yoga
  include_all_types: true   # include all observed activity types by default
  exclude_types: []         # optional explicit exclusions while still allowing new sport types
  group_other_types: false  # when false, keep raw source activity names as-is
  other_bucket: OtherSports # fallback bucket for unknown activity categories
  group_aliases: {}         # optional explicit group overrides, e.g. {SkiErg: WinterSports}
  type_aliases: {}          # optional explicit remaps; keep empty for exact source naming

units:
  distance: "mi"   # "mi" or "km"
  elevation: "ft"  # "ft" or "m"

heatmaps:
  week_start: "sunday" # "sunday" or "monday"

running_economy:
  # Personal physiological constants. hr_max is the highest HR actually recorded
  # in this athlete's runs; hr_rest comes from Garmin wellness.
  # vo2max_ref is FROZEN on purpose — see scripts/running_economy.py for why
  # feeding the per-activity vo2_max makes the metric circular.
  hr_max: 181
  hr_rest: 54
  vo2max_ref: 39.0
  sex: "male"          # selects Garmin's rating band table

# Body page (weight + home blood pressure). Non-personal tuning only: height is
# NOT here (this repo is public) — set it once with
#   python scripts/sync_body_db.py --set-height <cm>
# It is stored in the body_profile table. See docs/body-metrics.md.
body:
  bmi_standard: asia_pacific   # asia_pacific | who | kemenkes
  target_bmi: 22.9             # top of the Asia-Pacific normal band
  morning_before_hour: 12      # sessions before this hour count as "pagi"
  evening_from_hour: 17        # sessions from this hour count as "malam"

# Map data (scripts/sync_locations.py). Activities listed here are never stored, so a
# manual DELETE from activity_locations is not undone by the daily sync.
locations:
  exclude_activity_ids:
    - "23862443418"   # corrupt GPS: the final fix jumped ~400 km
